<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SoftAce</title>

  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <main>
    <!-- HERO SECTION -->
    <section class="hero-section">
      <div class="hero-card hero-card-top-left">
        <img src="./assets/images/hero-card-1.png" alt="" />
      </div>

      <div class="hero-card hero-card-top-right">
        <img src="./assets/images/hero-card-2.png" alt="" />
      </div>

      <div class="hero-content">
        <p class="hero-kicker">ONE PLATFORM</p>

        <h1>
          EVERY DOCUMENT, <br />
          EVERY APPROVAL
        </h1>

        <p class="hero-description">
          Streamline document creation, review, and approvals across your organization
          with one secure and intelligent document management system.
        </p>
      </div>

      <div class="hero-card hero-card-bottom-left">
        <img src="./assets/images/hero-card-3.png" alt="" />
      </div>

      <div class="hero-card hero-card-bottom-right">
        <img src="./assets/images/hero-card-4.png" alt="" />
      </div>
    </section>
  </main>

  <script src="./js/script.js"></script>

</html>
